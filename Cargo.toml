[workspace]
resolver = "2"
members = [
    "crates/workflow-core",
    "crates/workflow-schema",
    "crates/workflow-steps",
    "crates/workflow-cli",
    "crates/workflow-tpu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
fs2 = "0.4"
walkdir = "2"
