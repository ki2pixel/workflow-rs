[workspace]
resolver = "2"
members = [
    "crates/workflow-core",
    "crates/workflow-schema",
    "crates/workflow-steps",
    "crates/workflow-cli",
    "crates/workflow-bridge",
    "crates/workflow-tpu",
    "crates/workflow-ingest",
    "crates/workflow-server",
    "crates/workflow-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
fs2 = "0.4"
walkdir = "2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
rustfft = "6.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "json", "charset", "http2"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
libloading = "0.8"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "sync", "time", "macros", "net", "signal", "fs"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic", "tracing", "cuda"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
minijinja = "2"
glob = "0.3"
http-body-util = "0.1"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "lzma"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.5"
xz2 = "0.1"
unicode-normalization = "0.1"
rayon = "1"
