# Modèles QA optionnels du contrôle read-only.
#
# Les binaires DINOv2, PP-OCRv6 et YuNet ne sont pas versionnés ; le probe
# linéaire (384 poids, biais, seuil) l'est, car il est petit et auditable.
# `workflow-cli qa run` et le gate OCR A2 (`a2_ocr = true`) chargent ces
# fichiers par défaut ; `--no-logo-visual` désactive le vérificateur visuel.

version = 1
source = "https://huggingface.co/onnx-community/dinov2-small"
base_model = "facebook/dinov2-small"
license = "Apache-2.0"

[[model]]
role = "qa.ocr.det"
path = "PP-OCRv6_det_small.onnx"
size = 9929594
sha256 = "090f04abcd9d9a7498bc4ebf677e4cb9bdce1fe4197ddb7e529f1ef44e1ff94f"
license = "Apache-2.0"
source = "rapidocr 3.10.0, https://github.com/RapidAI/RapidOCR"
purpose = "détection de texte (sous-titres, logos, gate OCR A2)"

[[model]]
role = "qa.ocr.rec"
path = "PP-OCRv6_rec_small.onnx"
size = 21234383
sha256 = "6f327246b50388f3c176ae304bd95767ea6dc0c9ae92153ef8cbe210b3c14884"
license = "Apache-2.0"
source = "rapidocr 3.10.0, https://github.com/RapidAI/RapidOCR"
purpose = "reconnaissance de texte (sous-titres, logos, gate OCR A2)"

[[model]]
role = "qa.face.yunet"
path = "face_detection_yunet_2023mar.onnx"
size = 232589
sha256 = "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
license = "MIT"
source = "OpenCV Zoo, https://github.com/opencv/opencv_zoo/tree/main/models/face_detection_yunet"
purpose = "visages et landmarks 5 points"

[[model]]
role = "qa.dinov2"
path = "dinov2_vits14_quantized.onnx"
source_url = "https://huggingface.co/onnx-community/dinov2-small/resolve/main/onnx/model_quantized.onnx"
size = 24446700
sha256 = "c179f8f7f592449c4c1bca4cd124a7538021428c5ffb89afde9503935b197efb"
purpose = "DINOv2 ViT-S/14 quantifié, embeddings CLS pour le vérificateur visuel"

[[model]]
role = "qa.dinov2_probe"
path = "dinov2_logo_probe.json"
size = 11052
sha256 = "e7fa8a7d0a09dbc78d2a3746b9fe54c092746b6bd328eb52961be682d0afcce4"
purpose = "Probe logistique logo/non-logo entraîné sur les assets dev de la galerie"
input = "CLS 384, normalisé L2, sigmoïde(w·x + b)"
operating_point = "seuil 0.50, persistance 3/12"
geometry = "hauteur 18–220 px, largeur ≥ 30 px, aspect ≥ 1.2"
