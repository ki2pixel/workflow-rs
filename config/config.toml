# Configuration de workflow-rs
#
# Les secrets ne sont pas écrits dans ce fichier. Ils sont lus depuis
# l'environnement, avec priorité aux noms WORKFLOW_* :
#
# - WORKFLOW_SERVER_SECRET_KEY ;
# - WORKFLOW_SERVER_WORKER_TOKEN ;
# - WORKFLOW_SERVER_PORT (optionnel) ;
# - WORKFLOW_PATHS_BASE (optionnel) ;
# - WORKFLOW_WEBHOOK_URL (optionnel).
#
# Les anciens noms FLASK_SECRET_KEY et INTERNAL_WORKER_COMMS_TOKEN restent
# acceptés pour la période de transition. Les autres clés viennent uniquement
# de ce TOML, qui refuse toute clé inconnue.

[server]
host = "127.0.0.1"
port = 5004
debug = false
secret_key = ""
worker_token = ""
workflow_cli = "/home/kidpixel/workflow-rs/target/release/workflow-cli"
workdir = "/home/kidpixel/workflow-rs"
frontend_dir = "/home/kidpixel/workflow-rs/assets/web/static"
template = "/home/kidpixel/workflow-rs/assets/web/templates/index_new.html"
sound_design_dir = "/home/kidpixel/workflow-rs/assets/web/sound-design"
max_step_log_bytes = 5242880

[paths]
base = "/home/kidpixel/workflow-rs/runtime"
models = "/home/kidpixel/workflow-rs/assets/models"
projects = "/home/kidpixel/workflow-rs/runtime/projets_extraits"
archives = "/home/kidpixel/workflow-rs/runtime/archives"
logs = "/home/kidpixel/workflow-rs/runtime/logs"
downloads = "/home/kidpixel/workflow-rs/runtime/downloads"
history_db = "/home/kidpixel/workflow-rs/runtime/download_history.sqlite3"
cache_root = "/mnt/cache"
finalized = "/mnt/cache"

[webhook]
url = "https://webhook.kidpixel.fr/webhook_proxy.php"

[steps]
default_timeout_s = 1800

[steps.filter]
keyword = "Camille"
docs_subfolder = "docs"

[steps.step1]
source_dir = "/home/kidpixel/Téléchargements"
normalize = true
fps = 25
use_gpu = true
crf = 28
gpu_workers = 3
delete_archive = true
timeout_s = 14400
skip_preserved_mov = true
preserved_mov_names = ["m6+.mov"]

[steps.step5]
tracking_analytics = true
expression_summary = false
expression_keys = ["jawOpen"]

[steps.step3]
enabled = true
yamnet_split = true
require_edgetpu = true
device = "tpu"
embedding_stride = 1
adaptive_stride = false
adaptive_threshold = 500
max_workers = 1
yamnet = "step3/yamnet_split_edgetpu_compiled.tflite"
yamnet_fallback = "step3/yamnet_split_quantized.tflite"
mel_matrix = "step3/yamnet_mel_matrix.npy"
ecapa = "step3/ecapa_tdnn_speaker_float.onnx"
tflite = "/home/kidpixel/workflow-rs/vendor/libtensorflowlite_c.so"
edgetpu = "/usr/lib/x86_64-linux-gnu/libedgetpu.so.1"
onnxruntime = "/home/kidpixel/workflow_mediapipe/coral_env/lib/python3.11/site-packages/onnxruntime/capi/libonnxruntime.so.1.23.2"
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
ffmpeg_threads = 0
cpu_threads = 1
vad_threshold = 0.2
hop_overlap = 0.5
median_filter_size = 5
hangover_sec = 1.0
max_speakers = 5
clustering_threshold = 0.32
min_speaker_speech_duration = 7.0
min_cluster_embeddings = 4
ecapa_batch_size = 32

[steps.step4]
enabled = true
device = "tpu"
cocompiled = true
tflite = "/home/kidpixel/workflow-rs/vendor/libtensorflowlite_c.so"
# Paquet Coral installé sur le système. Pour un paquet extrait localement,
# utiliser --edgetpu (et --tflite si nécessaire) au lancement.
edgetpu = "/usr/lib/x86_64-linux-gnu/libedgetpu.so.1"
blazeface = "step4/blazeface_front_quantized_edgetpu.tflite"
facemesh = "step4/facemesh_quantized_edgetpu.tflite"
blendshapes = "step4/face_blendshapes.tflite"
object_detector = "detect_edgetpu"
object_detector_path = "step4/detect_edgetpu.tflite"
blazeface_cpu = "step4/blazeface_front_quantized.tflite"
facemesh_cpu = "step4/facemesh_quantized.tflite"
object_detector_cpu = "step4/detect.tflite"
object_detection = true
object_min_missing = 25
face_reset_frames = 1
object_score_threshold = 0.3
object_max = 5
fast = true
cpu_threads = 1
blendshapes_profile = "full"
blendshapes_export = ["jawOpen"]
blendshapes_include_tongue = false
jaw_open_threshold = 0.08
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
decode_width = 0
decode_height = 0

[steps.step6]
spread_threshold = 200
enable_confidence_weighting = true
confidence_weight = 0.35
label_high_spread = 12
label_stable = 3
label_fallback_center = 1

[steps.step7]
cleanup_threshold_hours = 48
mode = "lenient"
restore_archives = false
delete_source = true

[steps.step8]
timeout_s = 14400
cli = "effectcraft-cli"
panel_jsx = "assets/effectcraft/MediaSolution.jsx"
panel_config = "assets/effectcraft/mediasolution_ec.json"
docs_subfolder = "docs"
max_drivers_kept = 10

[retention]
# Projets sources : `steps.step7.cleanup_threshold_hours` (48 h) est utilisé.
# Les sorties finalisées (`paths.finalized`, /mnt/cache) ne sont jamais
# supprimées automatiquement. `downloads_days` est désactivé par défaut :
# le dossier Téléchargements personnel n'est pas un répertoire géré.
archives_days = 90
logs_days = 30
downloads_days = 0
reports_days = 90

[hardware]
# Verrou distinct du serveur Python legacy (/tmp/workflow-hw.lock).
lock_path = "/tmp/workflow-rs-hw.lock"
tpu_device = "/dev/apex_0"
gpu_mem_limit_mb = 4096
require_tpu = true

[steps.step2]
cudnn_algo_search = true
batch_size = 8
window = 100
stride = 50
padding = 25
threshold = 0.5
device = "cuda"
model = "step2/transnetv2.onnx"
onnxruntime = "/mnt/venv_ext4/transnet_cv5_env/lib/python3.10/site-packages/onnxruntime/capi/libonnxruntime.so.1.23.2"
cuda_lib_dirs = []
auto_cuda_libs = true
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
ffmpeg_threads = 0
use_tf32 = false
