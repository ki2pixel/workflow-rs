# Correspondance entre le .env de workflow_mediapipe et le config.toml de workflow-rs.
#
# status :
#   keep      la clé est reprise à l'identique
#   rename    la clé change de nom ou de section
#   test-only la clé ne sert qu'aux tests sans matériel
#   new       clé nouvelle, sans équivalent dans l'ancien .env
#   drop      clé volontairement non portée
#
# Toute clé absente de ce fichier doit être traitée comme "drop" et documentée
# dans le journal de divergence.

version = 1
date = "2026-10-22"

